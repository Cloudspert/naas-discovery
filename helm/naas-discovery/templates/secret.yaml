apiVersion: v1
kind: Secret
metadata:
  name: {{ include "naas-discovery.fullname" . }}-auth
  labels:
    {{- include "naas-discovery.labels" . | nindent 4 }}
type: Opaque
stringData:
  # §10: mounted as a file (CLUSTER_BASIC_AUTH_USERS_FILE), not flattened
  # into env vars like naas-api's secretRef does.
  basic-auth-users.yaml: |
    {{- toYaml .Values.auth.basicUsers | nindent 4 }}
{{- if eq .Values.config.telemetryModule "prometheus" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "naas-discovery.fullname" . }}-telemetry
  labels:
    {{- include "naas-discovery.labels" . | nindent 4 }}
type: Opaque
stringData:
  # §8: the WHOLE file is a Secret, not a ConfigMap, because it can carry
  # plaintext username/password alongside the (non-sensitive) PromQL query.
  telemetry.yaml: |
    prometheus_url: {{ .Values.telemetry.prometheusUrl | quote }}
    {{- if .Values.telemetry.username }}
    username: {{ .Values.telemetry.username | quote }}
    password: {{ .Values.telemetry.password | quote }}
    {{- end }}
    capacity_query: |
      {{- .Values.telemetry.capacityQuery | nindent 6 }}
    {{- if .Values.telemetry.overrides }}
    overrides:
    {{- range .Values.telemetry.overrides }}
      # NOTE: keys below are snake_case on purpose -- they must match
      # app/telemetry/config.py's TelemetryOverride fields exactly, not
      # this values.yaml's camelCase convention.
      - name: {{ .name | quote }}
        {{- if .prometheusUrl }}
        prometheus_url: {{ .prometheusUrl | quote }}
        {{- end }}
        {{- if .username }}
        username: {{ .username | quote }}
        password: {{ .password | quote }}
        {{- end }}
        {{- if .capacityQuery }}
        capacity_query: |
          {{- .capacityQuery | nindent 10 }}
        {{- end }}
    {{- end }}
    {{- end }}
{{- end }}
