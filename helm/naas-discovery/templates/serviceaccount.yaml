{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "naas-discovery.serviceAccountName" . }}
  labels:
    {{- include "naas-discovery.labels" . | nindent 4 }}
# No RBAC bound to this ServiceAccount -- naas-discovery never talks to
# the Kubernetes API of the cluster it runs on (design doc §12).
{{- end }}
